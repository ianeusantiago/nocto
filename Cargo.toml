[package]
name = "nocto"
version = "0.2.0"
edition = "2024"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software", "unstable-winit-030"] }

nocto-core = { path = "core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Security", "Media_Control", "Foundation", "Win32_System_Com", "UI", "UI_Composition", "UI_Composition_Desktop", "Foundation_Numerics", "System", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Storage_Streams", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-numerics = "0.3.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.dev]
debug = false
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["core"]
